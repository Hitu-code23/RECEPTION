<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hitin Banga &mdash; Digital Crafter</title>

    <!-- Webfont: Helvetica Neue ME (async print→all load pattern) -->
    <link
      rel="stylesheet"
      type="text/css"
      media="print"
      onload="this.media='all'"
      href="https://db.onlinewebfonts.com/c/95cecf452d3208890088a5b4c19c7ecf?family=Helvetica+Neue+ME"
    />

    <!-- Tailwind CSS (Play CDN, JIT ) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: "#efeee9",
            },
            fontFamily: {
              hn: ['"Helvetica Neue ME"', "Helvetica", "Arial", "sans-serif"],
              sans: ['"Helvetica Neue ME"', "Helvetica", "Arial", "sans-serif"],
              serif: ['"Helvetica Neue ME"', "Helvetica", "Arial", "sans-serif"],
            },
          },
        },
      };
    </script>

    <!-- React + ReactDOM (UMD ) -->
    <script
      src="https://unpkg.com/react@18/umd/react.production.min.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
      crossorigin
    ></script>

    <!-- Babel standalone: in-browser JSX transform -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Helvetica Neue ME", Helvetica, Arial, sans-serif;
        background-color: #000;
      }

      /* ---------- Marquee ---------- */
      @keyframes marquee-scroll {
        from {
          transform: translateX(0 );
        }
        to {
          transform: translateX(-50%);
        }
      }

      .marquee {
        animation: marquee-scroll 30s linear infinite;
      }

      /* ---------- Entrance animations ---------- */
      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes rise-in {
        from {
          opacity: 0;
          transform: translateY(4vh) scale(1.03);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes fade-up {
        from {
          opacity: 0;
          transform: translateY(28px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes line-grow {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }

      .anim-fade-in {
        animation: fade-in 1.2s ease-out both;
      }

      .anim-rise-in {
        animation: rise-in 1.4s cubic-bezier(0.22, 1, 0.36, 1) both;
        animation-delay: 300ms;
      }

      .anim-fade-up {
        animation: fade-up 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .anim-line {
        transform-origin: left;
        animation: line-grow 1.1s cubic-bezier(0.76, 0, 0.24, 1) both;
        animation-delay: 1200ms;
      }

      /* ---------- Reduced motion ---------- */
      @media (prefers-reduced-motion: reduce) {
        .anim-fade-in,
        .anim-rise-in,
        .anim-fade-up,
        .anim-line {
          animation-duration: 0.01ms !important;
          animation-delay: 0ms !important;
        }

        .marquee {
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
      const { useEffect, useState } = React;

      // Background image - using a gradient background for elegant minimal look
      const BG_IMAGE =
        "linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)";

      // Hero portrait image - your photo
      const FRONT_IMAGE =
        "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260729_022513_486985a2-ac8c-4278-91a8-071dcd9fcaff.png&w=1280&q=85";

      const NAV_LINKS = [
        { label: "Velorien", url: "https://hitu-code23.github.io/Velorien/" },
        { label: "Architecture", url: "https://hitu-code23.github.io/Architecture-/" },
        { label: "Contact", url: "#" },
      ];
      const SOCIAL_LINKS = [
        { label: "GitHub", url: "#" },
        { label: "LinkedIn", url: "#" },
        { label: "Twitter", url: "#" },
      ];

      const EASE_DRAWER = "cubic-bezier(0.76, 0, 0.24, 1 )";

      function XIcon({ size = 26, strokeWidth = 1.5 }) {
        return (
          <svg
            width={size}
            height={size}
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth={strokeWidth}
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        );
      }

      function App() {
        const [drawerOpen, setDrawerOpen] = useState(false);

        useEffect(() => {
          document.title = "Hitin Banga — Digital Crafter";
        }, []);

        useEffect(() => {
          document.body.style.overflow = drawerOpen ? "hidden" : "";
          return () => {
            document.body.style.overflow = "";
          };
        }, [drawerOpen]);

        return (
          <section className="relative h-[100dvh] w-full overflow-hidden bg-black">
            {/* Background gradient */}
            <div
              className="anim-fade-in absolute inset-0 h-full w-full"
              style={{
                background: BG_IMAGE,
              }}
            />

            {/* Marquee name */}
            <div
              className="anim-fade-up absolute inset-x-0 top-[16vh] z-10 overflow-hidden sm:top-[14vh]"
              style={{ animationDelay: "500ms" }}
            >
              <div className="marquee flex w-max whitespace-nowrap font-hn text-[16vh] leading-none text-cream sm:text-[26vh]">
                <span className="pr-[6vw]">Hitin &mdash; Banga&nbsp;</span>
                <span className="pr-[6vw]">Hitin &mdash; Banga&nbsp;</span>
              </div>
            </div>

            {/* Cream rule */}
            <div className="anim-line absolute inset-x-6 bottom-[5.5rem] z-10 h-0.5 bg-cream sm:inset-x-10 sm:bottom-28" />

            {/* Footer (desktop z-10 / mobile z-30) */}
            <footer className="absolute inset-x-0 bottom-0 z-30 flex items-end justify-between px-6 pb-5 font-hn text-xs leading-relaxed text-cream sm:z-10 sm:px-10 sm:pb-8 sm:text-sm">
              <div className="anim-fade-up" style={{ animationDelay: "1400ms" }}>
                <p>Digital Crafter</p>
                <p>Web Developer</p>
                <p>Design Enthusiast</p>
              </div>
              <div
                className="anim-fade-up text-right"
                style={{ animationDelay: "1550ms" }}
              >
                <p>Based in</p>
                <p>India</p>
              </div>
            </footer>

            {/* Front portrait cutout */}
            <img
              src={FRONT_IMAGE}
              alt="Hitin Banga Portrait"
              className="anim-rise-in pointer-events-none absolute inset-0 z-20 h-full w-full object-cover"
            />

            {/* Header */}
            <header className="absolute inset-x-0 top-0 z-30 flex items-start justify-between px-6 pt-6 sm:px-10 sm:pt-8">
              <a
                href="#"
                className="anim-fade-up font-hn text-lg tracking-wide text-cream"
                style={{ animationDelay: "800ms" }}
              >
                Hitin
              </a>

              <div className="hidden items-start gap-16 sm:flex lg:gap-24">
                <span
                  className="anim-fade-up text-sm text-cream"
                  style={{ animationDelay: "900ms" }}
                >
                  2025
                </span>

                <nav className="flex flex-col gap-0.5 text-sm">
                  {NAV_LINKS.map((item, i) => (
                    <a
                      key={item.label}
                      href={item.url}
                      target={item.url.startsWith("http" ) ? "_blank" : "_self"}
                      rel={item.url.startsWith("http" ) ? "noopener noreferrer" : ""}
                      className="anim-fade-up text-cream transition-opacity duration-300 hover:opacity-60"
                      style={{ animationDelay: `${1000 + i * 80}ms` }}
                    >
                      {item.label}
                    </a>
                  ))}
                </nav>

                <div className="flex flex-col gap-0.5 text-sm">
                  {SOCIAL_LINKS.map((item, i) => (
                    <a
                      key={item.label}
                      href={item.url}
                      className="anim-fade-up text-cream transition-opacity duration-300 hover:opacity-60"
                      style={{ animationDelay: `${1150 + i * 80}ms` }}
                    >
                      {item.label}
                    </a>
                  ))}
                </div>
              </div>
            </header>

            {/* Mobile hamburger / close toggle */}
            <button
              type="button"
              aria-label={drawerOpen ? "Close menu" : "Open menu"}
              onClick={() => setDrawerOpen((v) => !v)}
              className="anim-fade-up fixed right-6 top-6 z-50 flex h-10 w-10 flex-col items-center justify-center gap-[5px] sm:hidden"
              style={{ animationDelay: "900ms" }}
            >
              <span
                className="h-[1.5px] w-6 bg-cream transition-transform duration-500"
                style={{
                  transitionTimingFunction: EASE_DRAWER,
                  transform: drawerOpen
                    ? "translateY(6.5px) rotate(45deg)"
                    : "translateY(0) rotate(0deg)",
                }}
              />
              <span
                className="h-[1.5px] w-6 bg-cream transition-opacity duration-300"
                style={{ opacity: drawerOpen ? 0 : 1 }}
              />
              <span
                className="h-[1.5px] w-6 bg-cream transition-transform duration-500"
                style={{
                  transitionTimingFunction: EASE_DRAWER,
                  transform: drawerOpen
                    ? "translateY(-6.5px) rotate(-45deg)"
                    : "translateY(0) rotate(0deg)",
                }}
              />
            </button>

            {/* Mobile drawer backdrop */}
            <div
              onClick={() => setDrawerOpen(false)}
              className={`fixed inset-0 z-40 bg-black/40 backdrop-blur-sm transition-opacity duration-500 sm:hidden ${
                drawerOpen ? "opacity-100" : "pointer-events-none opacity-0"
              }`}
            />

            {/* Mobile drawer panel */}
            <div
              className="fixed inset-y-0 right-0 z-40 w-[80%] max-w-sm bg-[#141414] px-8 py-10 transition-transform duration-[600ms] sm:hidden"
              style={{
                transitionTimingFunction: EASE_DRAWER,
                transform: drawerOpen ? "translateX(0)" : "translateX(100%)",
              }}
            >
              <button
                type="button"
                aria-label="Close menu"
                onClick={() => setDrawerOpen(false)}
                className="absolute right-6 top-6 text-cream transition-all duration-500"
                style={{
                  transitionDelay: drawerOpen ? "300ms" : "0ms",
                  transform: drawerOpen ? "rotate(0deg)" : "rotate(90deg)",
                  opacity: drawerOpen ? 1 : 0,
                }}
              >
                <XIcon size={26} strokeWidth={1.5} />
              </button>

              <div className="flex h-full flex-col justify-center gap-14">
                <div>
                  <p
                    className="text-xs uppercase tracking-[0.2em] text-cream/50 transition-all duration-500 ease-out"
                    style={{
                      transitionDelay: "250ms",
                      transform: drawerOpen ? "translateY(0)" : "translateY(8px)",
                      opacity: drawerOpen ? 1 : 0,
                    }}
                  >
                    Projects
                  </p>
                  <nav className="mt-4 flex flex-col gap-2">
                    {NAV_LINKS.map((item, i) => (
                      <a
                        key={item.label}
                        href={item.url}
                        target={item.url.startsWith("http" ) ? "_blank" : "_self"}
                        rel={item.url.startsWith("http" ) ? "noopener noreferrer" : ""}
                        className="text-4xl text-cream transition-all duration-500 ease-out"
                        style={{
                          transitionDelay: `${300 + i * 80}ms`,
                          transform: drawerOpen
                            ? "translateY(0)"
                            : "translateY(24px)",
                          opacity: drawerOpen ? 1 : 0,
                        }}
                      >
                        {item.label}
                      </a>
                    ))}
                  </nav>
                </div>

                <div>
                  <p
                    className="text-xs uppercase tracking-[0.2em] text-cream/50 transition-all duration-500 ease-out"
                    style={{
                      transitionDelay: "500ms",
                      transform: drawerOpen ? "translateY(0)" : "translateY(8px)",
                      opacity: drawerOpen ? 1 : 0,
                    }}
                  >
                    Find Me
                  </p>
                  <div className="mt-4 flex flex-wrap gap-x-4 gap-y-2">
                    {SOCIAL_LINKS.map((item, i) => (
                      <a
                        key={item.label}
                        href={item.url}
                        className="text-sm text-cream transition-all duration-500 ease-out"
                        style={{
                          transitionDelay: `${550 + i * 60}ms`,
                          transform: drawerOpen
                            ? "translateY(0)"
                            : "translateY(16px)",
                          opacity: drawerOpen ? 1 : 0,
                        }}
                      >
                        {item.label}
                      </a>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </section>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
