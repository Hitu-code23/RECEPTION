<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reception — Guest Verification Portal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── RESET & ROOT ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --ink:        #0f0d0a;
  --ink2:       #1e1a14;
  --paper:      #faf8f4;
  --paper2:     #f3efe7;
  --gold:       #b8922a;
  --gold2:      #d4aa50;
  --gold3:      #f0d890;
  --goldPale:   #fdf5e0;
  --border:     #e0d8c8;
  --border2:    #ccc0a0;
  --muted:      #8a7d64;
  --green:      #1e5f3e;
  --greenBg:    #eaf5ee;
  --greenBd:    #a8d5b8;
  --red:        #8b1a2a;
  --redBg:      #fdf0f1;
  --redBd:      #e8b0b8;
  --amber:      #8a5c00;
  --amberBg:    #fdf6e0;
  --amberBd:    #ddc878;
  --shadow:     0 2px 16px rgba(0,0,0,0.07);
  --shadowLg:   0 8px 40px rgba(0,0,0,0.13);
  --radius:     12px;
}

html { scroll-behavior: smooth; height: 100%; }

body {
  background: var(--paper2);
  color: var(--ink);
  font-family: 'Jost', sans-serif;
  font-weight: 400;
  min-height: 100%;
  line-height: 1.6;
  overflow-x: hidden;
}

/* ── TOPBAR ─────────────────────────────────────────────────── */
.topbar {
  background: var(--ink2);
  border-bottom: 1px solid #3a3020;
  position: sticky;
  top: 0;
  z-index: 200;
  display: flex;
  flex-direction: column;
}

.topbar-main {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 1rem;
}

.topbar-brand {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  text-decoration: none;
}

.brand-emblem {
  width: 30px; height: 30px;
  border: 1.5px solid var(--gold);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  color: var(--gold);
  flex-shrink: 0;
}

.brand-text {
  font-family: 'Libre Baskerville', serif;
  font-size: 0.85rem;
  color: #f5f0e8;
  letter-spacing: 0.05em;
  line-height: 1.1;
}
.brand-text small {
  display: block;
  font-family: 'Jost', sans-serif;
  font-size: 0.55rem;
  color: var(--gold2);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-weight: 500;
}

.topbar-tabs {
  display: flex;
  background: rgba(0,0,0,0.2);
  overflow-x: auto;
  scrollbar-width: none;
}
.topbar-tabs::-webkit-scrollbar { display: none; }

.tab-btn {
  flex: 1;
  background: none;
  border: none;
  color: #7a7060;
  font-family: 'Jost', sans-serif;
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.8rem 0.5rem;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
  white-space: nowrap;
  min-width: 80px;
}
.tab-btn:active { background: rgba(255,255,255,0.05); }
.tab-btn.active { color: var(--gold2); border-bottom-color: var(--gold); background: rgba(255,255,255,0.03); }

.tab-btn svg { width: 18px; height: 18px; opacity: 0.7; }
.tab-btn.active svg { opacity: 1; }

/* ── PAGES ──────────────────────────────────────────────────── */
.page { display: none; animation: fadeIn 0.3s ease; padding-bottom: 4rem; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

/* ── PAGE HEADER ────────────────────────────────────────────── */
.page-header {
  background: var(--ink2);
  padding: 1.5rem 1.25rem 1rem;
  position: relative;
  overflow: hidden;
}
.page-header::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), var(--gold2), var(--gold), transparent);
}
.page-header-inner { max-width: 1100px; margin: 0 auto; }

.page-eyebrow {
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold2);
  font-weight: 600;
  margin-bottom: 0.3rem;
}
.page-title {
  font-family: 'Libre Baskerville', serif;
  font-size: 1.5rem;
  color: #f5f0e8;
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 0.3rem;
}
.page-desc { font-size: 0.78rem; color: #7a7060; margin-bottom: 1.25rem; }

/* ── STAT STRIP ─────────────────────────────────────────────── */
.stat-strip {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: #3a3020;
  border-top: 1px solid #3a3020;
  border-bottom: 1px solid #3a3020;
}
.stat-cell {
  background: var(--ink2);
  padding: 0.75rem 1rem;
}
.stat-value {
  font-family: 'Libre Baskerville', serif;
  font-size: 1.25rem;
  color: var(--gold2);
  line-height: 1;
  font-weight: 700;
}
.stat-label { font-size: 0.55rem; color: #5a5040; letter-spacing: 0.12em; text-transform: uppercase; margin-top: 0.2rem; font-weight: 600; }

/* ── BODY AREA ──────────────────────────────────────────────── */
.page-body { max-width: 1100px; margin: 0 auto; padding: 1rem; }

/* ── GRID LAYOUT ────────────────────────────────────────────── */
.two-col { display: flex; flex-direction: column; gap: 1rem; }

/* ── CARDS ──────────────────────────────────────────────────── */
.card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.card-head {
  padding: 0.85rem 1rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
}
.card-title {
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.card-body { padding: 1rem; }
.card-body.compact { padding: 0.5rem; }

/* ── INPUTS ─────────────────────────────────────────────────── */
.field { margin-bottom: 0.8rem; }
.field label {
  display: block;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.35rem;
}
.field input, .field textarea, .field select {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.75rem 0.9rem;
  font-family: 'Jost', sans-serif;
  font-size: 1rem; /* Prevents iOS zoom on focus */
  color: var(--ink);
  background: var(--paper);
  outline: none;
  transition: all 0.2s;
  -webkit-appearance: none;
}
.field input:focus, .field textarea:focus, .field select:focus {
  border-color: var(--gold);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(184,146,42,0.1);
}

.input-row { display: flex; gap: 0.5rem; }
.input-row .field { flex: 1; margin: 0; }
.input-row .btn-primary { padding: 0 1.25rem; }

/* ── BUTTONS ────────────────────────────────────────────────── */
.btn-primary {
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 0.8rem 1.25rem;
  font-family: 'Jost', sans-serif;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 12px rgba(184,146,42,0.2);
}
.btn-primary:active { transform: scale(0.96); opacity: 0.9; }

.btn-ghost {
  background: transparent;
  color: var(--gold);
  border: 1.5px solid var(--border2);
  border-radius: 8px;
  padding: 0.7rem 1rem;
  font-family: 'Jost', sans-serif;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}
.btn-ghost:active { background: var(--goldPale); }

.btn-icon {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 8px;
  width: 40px; height: 40px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 1rem;
  color: var(--muted);
}
.btn-icon:active { background: var(--border); color: var(--ink); }

/* ── GUEST LIST ─────────────────────────────────────────────── */
.guest-table { width: 100%; border-collapse: collapse; }
.guest-table th {
  font-size: 0.55rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
  padding: 0.75rem 0.5rem;
  text-align: left;
  border-bottom: 2px solid var(--border);
}
.guest-table td {
  padding: 0.85rem 0.5rem;
  border-bottom: 1px solid var(--border);
  font-size: 0.85rem;
}
.guest-name-cell { font-weight: 600; color: var(--ink); }
.guest-id-cell { font-family: monospace; font-size: 0.7rem; color: var(--muted); }

.badge {
  display: inline-flex; align-items: center; gap: 0.35rem;
  padding: 0.25rem 0.6rem;
  border-radius: 20px;
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.badge-pending { background: var(--amberBg); color: var(--amber); }
.badge-checked { background: var(--greenBg); color: var(--green); }
.badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

/* ── SCANNER ────────────────────────────────────────────────── */
.scanner-layout { display: flex; flex-direction: column; gap: 1.25rem; }
.scanner-frame {
  width: 100%;
  max-width: 400px;
  margin: 0 auto;
  aspect-ratio: 1;
  background: #000;
  border: 3px solid var(--border2);
  border-radius: 20px;
  position: relative;
  overflow: hidden;
}
.scanner-frame.active-scan { border-color: var(--gold); }

#reader { width: 100%; height: 100%; }
#reader video { object-fit: cover !important; }

.scan-overlay {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.scan-reticle {
  width: 60%; height: 60%;
  border: 2px dashed rgba(255,255,255,0.3);
  border-radius: 15px;
  position: relative;
}
.scan-line {
  position: absolute; top: 0; left: 0; right: 0;
  height: 2px; background: var(--gold2);
  box-shadow: 0 0 15px var(--gold);
  animation: scanMove 2s infinite ease-in-out;
}
@keyframes scanMove { 0%, 100% { top: 0%; } 50% { top: 100%; } }

/* ── RESULT CARD ────────────────────────────────────────────── */
.result-card {
  border-radius: var(--radius);
  padding: 1.25rem;
  text-align: center;
  border: 2px solid;
  margin-bottom: 1rem;
  animation: resultPop 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
.result-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
.result-title { font-family: 'Libre Baskerville', serif; font-size: 1.25rem; font-weight: 700; margin-bottom: 0.25rem; }
.result-name { font-size: 1rem; font-weight: 600; }

.result-success { background: var(--greenBg); border-color: var(--greenBd); color: var(--green); }
.result-fail    { background: var(--redBg);   border-color: var(--redBd);   color: var(--red); }
.result-used    { background: var(--amberBg); border-color: var(--amberBd); color: var(--amber); }

/* ── MODAL ──────────────────────────────────────────────────── */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(5px);
  z-index: 1000;
  align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #fff;
  width: 100%;
  border-radius: 20px 20px 0 0;
  padding: 1.5rem;
  max-height: 90vh;
  overflow-y: auto;
  animation: slideUp 0.3s ease-out;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.modal-qr-wrap {
  background: #fff;
  padding: 1rem;
  border-radius: 15px;
  border: 1px solid var(--border);
  display: inline-block;
  margin-bottom: 1rem;
}
.modal-qr-wrap canvas { max-width: 100%; height: auto !important; }

/* ── TOAST ──────────────────────────────────────────────────── */
#toast {
  position: fixed; bottom: 2rem; left: 1rem; right: 1rem;
  background: var(--ink); color: #fff;
  padding: 1rem; border-radius: 12px;
  font-size: 0.85rem; font-weight: 600;
  text-align: center;
  transform: translateY(150%);
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  z-index: 2000;
  box-shadow: var(--shadowLg);
}
#toast.show { transform: translateY(0); }

/* ── UTILS ──────────────────────────────────────────────────── */
.mt-2 { margin-top: 1rem; }
.text-muted { font-size: 0.7rem; color: var(--muted); margin-top: 0.5rem; }
.gap-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-main">
    <div class="topbar-brand">
      <div class="brand-emblem">✦</div>
      <div class="brand-text">Reception <small>Guest Portal</small></div>
    </div>
    <div style="display:flex; align-items:center; gap:0.5rem">
      <div class="live-dot" style="width:8px; height:8px; background:#3db87a; border-radius:50%"></div>
      <span style="font-size:0.6rem; color:#7a7060; font-weight:700; text-transform:uppercase">Live</span>
    </div>
  </div>
  <nav class="topbar-tabs">
    <button class="tab-btn active" onclick="showPage('admin')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Guests
    </button>
    <button class="tab-btn" onclick="showPage('scanner')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 7h.01M7 12h.01M7 17h.01M12 7h5M12 12h5M12 17h5"/></svg>
      Scanner
    </button>
    <button class="tab-btn" onclick="showPage('log')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Log
    </button>
  </nav>
</header>

<div class="page active" id="page-admin">
  <div class="page-header">
    <p class="page-eyebrow">Management</p>
    <h1 class="page-title">Guest List</h1>
    <p class="page-desc">Manage invitations and track attendance.</p>
    <div class="stat-strip">
      <div class="stat-cell"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Total</div></div>
      <div class="stat-cell"><div class="stat-value" id="stat-checked">0</div><div class="stat-label">In</div></div>
    </div>
  </div>

  <div class="page-body">
    <div class="two-col">
      <div class="card">
        <div class="card-head"><span class="card-title">Add Guest</span></div>
        <div class="card-body">
          <div class="field">
            <div class="input-row">
              <input type="text" id="guest-input" placeholder="Guest Name" onkeydown="if(event.key==='Enter')addGuest()" />
              <button class="btn-primary" onclick="addGuest()">Add</button>
            </div>
          </div>
          <details>
            <summary style="font-size:0.7rem; color:var(--gold); font-weight:700; cursor:pointer">Bulk Import</summary>
            <div class="field mt-2">
              <textarea id="bulk-input" placeholder="Names (one per line)" style="min-height:100px"></textarea>
              <button class="btn-primary mt-2" style="width:100%" onclick="bulkImport()">Import All</button>
            </div>
          </details>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <span class="card-title">Guests</span>
          <button class="btn-ghost" onclick="clearAll()" style="color:var(--red); border-color:var(--redBd); padding:0.4rem 0.6rem; font-size:0.6rem">Reset</button>
        </div>
        <div class="card-body compact">
          <div class="field" style="padding:0.5rem">
            <input type="text" id="search-input" placeholder="Search..." oninput="renderGuests()" />
          </div>
          <div style="overflow-x:auto">
            <table class="guest-table">
              <tbody id="guest-tbody"></tbody>
            </table>
          </div>
          <div id="guest-empty" style="text-align:center; padding:2rem; color:var(--muted); font-size:0.8rem">No guests found.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="page" id="page-scanner">
  <div class="page-header">
    <p class="page-eyebrow">Security</p>
    <h1 class="page-title">Scanner</h1>
    <div class="stat-strip">
      <div class="stat-cell"><div class="stat-value" id="s-total">0</div><div class="stat-label">Invited</div></div>
      <div class="stat-cell"><div class="stat-value" id="s-checked">0</div><div class="stat-label">Admitted</div></div>
    </div>
  </div>

  <div class="page-body">
    <div class="scanner-layout">
      <div id="result-area"></div>
      <div class="scanner-frame" id="scanner-frame">
        <div id="reader"></div>
        <div class="scan-overlay">
          <div class="scan-reticle"><div class="scan-line"></div></div>
        </div>
      </div>
      <button class="btn-primary" id="scan-toggle-btn" style="width:100%; padding:1rem" onclick="toggleScanner()">Start Camera</button>
      
      <div class="card mt-2">
        <div class="card-head"><span class="card-title">Manual Entry</span></div>
        <div class="card-body">
          <div class="input-row">
            <input type="text" id="manual-input" placeholder="Guest ID or Name" />
            <button class="btn-primary" onclick="manualVerify()">Verify</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="page" id="page-log">
  <div class="page-header">
    <p class="page-eyebrow">History</p>
    <h1 class="page-title">Entry Log</h1>
    <button class="btn-ghost" onclick="exportLog()" style="margin-top:1rem; color:#fff; border-color:rgba(255,255,255,0.2)">Export CSV</button>
  </div>
  <div class="page-body">
    <div class="card">
      <div class="card-body compact">
        <div id="log-tbody"></div>
        <div id="log-empty" style="text-align:center; padding:2rem; color:var(--muted)">No entries yet.</div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="qr-modal">
  <div class="modal">
    <div style="text-align:center">
      <div class="modal-qr-wrap" id="modal-qr-wrap"></div>
      <h2 id="modal-guest-name" style="font-family:'Libre Baskerville',serif; margin-bottom:0.5rem"></h2>
      <p id="modal-guest-id" style="font-family:monospace; font-size:0.8rem; color:var(--muted); margin-bottom:1.5rem"></p>
      <div class="gap-row" style="justify-content:center">
        <button class="btn-ghost" onclick="closeModal()">Close</button>
        <button class="btn-primary" onclick="downloadQR()">Download</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let guests = JSON.parse(localStorage.getItem('rxp_guests') || '[]');
let admLog  = JSON.parse(localStorage.getItem('rxp_log')   || '[]');
let evtInfo = JSON.parse(localStorage.getItem('rxp_evt')   || '{}');
let scanner = null, scannerRunning = false;
let currentModalGuest = null;

function save() {
  localStorage.setItem('rxp_guests', JSON.stringify(guests));
  localStorage.setItem('rxp_log',    JSON.stringify(admLog));
  localStorage.setItem('rxp_evt',    JSON.stringify(evtInfo));
}

function uid() { return 'RX-' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).substr(2,3).toUpperCase(); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  const tabs = ['admin','scanner','log'];
  document.querySelectorAll('.tab-btn')[tabs.indexOf(id)].classList.add('active');
  if (id === 'log') renderLog();
  if (id === 'scanner') updateScannerStats();
  if (id !== 'scanner' && scannerRunning) stopScanner();
  window.scrollTo(0,0);
}

function addGuest(nameOverride) {
  const inp = document.getElementById('guest-input');
  const name = (nameOverride || inp.value).trim();
  if (!name) return;
  guests.push({ id: uid(), name, checkedIn: false, checkedAt: null });
  if (!nameOverride) inp.value = '';
  save(); renderGuests();
  showToast('Added: ' + name);
}

function bulkImport() {
  const lines = document.getElementById('bulk-input').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!lines.length) return;
  lines.forEach(n => guests.push({ id: uid(), name: n, checkedIn: false, checkedAt: null }));
  document.getElementById('bulk-input').value = '';
  save(); renderGuests();
  showToast(lines.length + ' guests imported');
}

function removeGuest(id) {
  if(!confirm('Remove this guest?')) return;
  guests = guests.filter(g => g.id !== id);
  save(); renderGuests();
}

function clearAll() {
  if (!confirm('Clear all data?')) return;
  guests = []; admLog = [];
  save(); renderGuests();
  showToast('Cleared');
}

function renderGuests() {
  const query = (document.getElementById('search-input')?.value || '').toLowerCase();
  const checked = guests.filter(g => g.checkedIn).length;
  document.getElementById('stat-total').textContent = guests.length;
  document.getElementById('stat-checked').textContent = checked;

  let list = guests.filter(g => !query || g.name.toLowerCase().includes(query) || g.id.toLowerCase().includes(query));
  const tbody = document.getElementById('guest-tbody');
  const empty = document.getElementById('guest-empty');
  
  if (!list.length) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  tbody.innerHTML = list.map((g) => `
    <tr>
      <td>
        <div class="guest-name-cell">${esc(g.name)}</div>
        <div class="guest-id-cell">${esc(g.id)}</div>
      </td>
      <td>
        <span class="badge ${g.checkedIn ? 'badge-checked' : 'badge-pending'}">
          <span class="badge-dot"></span>
          ${g.checkedIn ? 'In' : 'Wait'}
        </span>
      </td>
      <td style="text-align:right">
        <div style="display:flex; gap:0.4rem; justify-content:flex-end">
          <button class="btn-icon" onclick="showQR('${g.id}')">🎟</button>
          <button class="btn-icon" onclick="removeGuest('${g.id}')" style="color:var(--red)">✕</button>
        </div>
      </td>
    </tr>`).join('');
}

function showQR(id) {
  const g = guests.find(x => x.id === id);
  if (!g) return;
  currentModalGuest = g;
  document.getElementById('modal-guest-name').textContent = g.name;
  document.getElementById('modal-guest-id').textContent = g.id;
  const box = document.getElementById('modal-qr-wrap');
  box.innerHTML = '';
  new QRCode(box, { text: g.id + '||' + g.name, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.H });
  document.getElementById('qr-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('qr-modal').classList.remove('open');
  currentModalGuest = null;
}

function downloadQR() {
  const canvas = document.querySelector('#modal-qr-wrap canvas');
  if (!canvas || !currentModalGuest) return;
  const link = document.createElement('a');
  link.download = 'QR_' + currentModalGuest.name.replace(/\s+/g,'_') + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  showToast('Downloaded');
}

function updateScannerStats() {
  const checked = guests.filter(g => g.checkedIn).length;
  document.getElementById('s-total').textContent = guests.length;
  document.getElementById('s-checked').textContent = checked;
}

function toggleScanner() {
  scannerRunning ? stopScanner() : startScanner();
}

function startScanner() {
  if (!scanner) scanner = new Html5Qrcode('reader');
  scanner.start(
    { facingMode: 'environment' },
    { fps: 15, qrbox: { width: 250, height: 250 } },
    onScanSuccess,
    () => {}
  ).then(() => {
    scannerRunning = true;
    document.getElementById('scan-toggle-btn').textContent = 'Stop Camera';
    document.getElementById('scanner-frame').classList.add('active-scan');
  }).catch(() => {
    showToast('Camera Error');
  });
}

function stopScanner() {
  if (scanner && scannerRunning) {
    scanner.stop().then(() => {
      scannerRunning = false;
      document.getElementById('scan-toggle-btn').textContent = 'Start Camera';
      document.getElementById('scanner-frame').classList.remove('active-scan');
    });
  }
}

let lastScan = ''; let lastScanTime = 0;
function onScanSuccess(text) {
  const now = Date.now();
  if (text === lastScan && now - lastScanTime < 3000) return;
  lastScan = text; lastScanTime = now;
  verifyCode(text);
}

function manualVerify() {
  const val = document.getElementById('manual-input').value.trim();
  if (!val) return;
  const g = guests.find(g => g.id === val) || guests.find(g => g.name.toLowerCase() === val.toLowerCase());
  if (!g) { showResult('fail','❌','Not Found','No guest matches this input.'); return; }
  checkIn(g);
  document.getElementById('manual-input').value = '';
}

function verifyCode(text) {
  const id = text.split('||')[0];
  const g = guests.find(x => x.id === id);
  if (!g) { showResult('fail','❌','Invalid','This code is not recognized.'); return; }
  checkIn(g);
}

function checkIn(g) {
  if (g.checkedIn) {
    showResult('used','⚠️','Already In', esc(g.name) + ' entered at ' + g.checkedAt);
    return;
  }
  const now = new Date();
  g.checkedIn = true;
  g.checkedAt = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  admLog.unshift({ id: g.id, name: g.name, time: g.checkedAt, date: now.toLocaleDateString() });
  save(); renderGuests(); updateScannerStats();
  showResult('success','✅','Welcome!', esc(g.name));
}

function showResult(type, icon, title, detail) {
  const area = document.getElementById('result-area');
  area.innerHTML = `<div class="result-card result-${type}">
    <div class="result-icon">${icon}</div>
    <div class="result-title">${title}</div>
    <div class="result-name">${detail}</div>
  </div>`;
  
  const frame = document.getElementById('scanner-frame');
  if (frame) {
    frame.style.borderColor = type === 'success' ? 'var(--green)' : (type === 'used' ? 'var(--amber)' : 'var(--red)');
    setTimeout(() => { frame.style.borderColor = scannerRunning ? 'var(--gold)' : 'var(--border2)'; }, 2000);
  }

  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    if (type === 'success') {
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
      osc.start(); osc.stop(ctx.currentTime + 0.2);
    } else {
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
      osc.start(); osc.stop(ctx.currentTime + 0.4);
    }
  } catch(e) {}

  if (window.navigator?.vibrate) window.navigator.vibrate(type === 'success' ? 100 : [100, 50, 100]);
  
  clearTimeout(showResult._t);
  showResult._t = setTimeout(() => { area.innerHTML = ''; }, 6000);
}

function renderLog() {
  const el = document.getElementById('log-tbody');
  const empty = document.getElementById('log-empty');
  if (!admLog.length) { el.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  el.innerHTML = admLog.map((e) => `
    <div style="padding:1rem; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center">
      <div>
        <div style="font-weight:700; font-size:0.9rem">${esc(e.name)}</div>
        <div style="font-size:0.7rem; color:var(--muted)">${e.date} · ${e.time}</div>
      </div>
      <span class="badge badge-checked">Admitted</span>
    </div>`).join('');
}

function exportLog() {
  if (!admLog.length) return;
  const rows = [['Name','ID','Date','Time']].concat(admLog.map(e => [e.name, e.id, e.date, e.time]));
  const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g,'""') + '"').join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'entry_log.csv';
  a.click();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 2500);
}

renderGuests();
</script>
</body>
</html>
